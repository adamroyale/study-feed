<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Ivrit · Study Feed</title>
  <link rel="stylesheet" href="../../assets/style.css">
  <script src="../../assets/store.js"></script>
  <script src="../../assets/config.js"></script>
  <script src="../../assets/sync.js"></script>
</head>
<body class="feed-body">
  <div class="progress-track"><div class="progress-bar" id="bar"></div></div>
  <div class="feed-top">
    <a class="back" href="index.html">‹ Decks</a>
    <span class="deck-name" id="deck-name"></span>
    <span class="parent-badge" id="parent-badge" style="display:none">Parent mode</span>
    <span id="counter"></span>
    <button class="icon-btn" id="theme-btn" aria-label="Toggle light and dark mode" style="width:32px;height:32px;font-size:0.9rem">◐</button>
  </div>
  <main id="feed"></main>
  <div class="swipe-hint" id="swipe-hint">Swipe up for the next card ↑</div>
  <script src="cards.js"></script>
  <script src="../../assets/feed.js"></script>
</body>
</html>
